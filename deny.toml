# cargo-deny configuration.
# Run: cargo deny check
# See SECURITY.md for the invariants this enforces.

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # number_prefix (transitive via indicatif's progress-bar byte-size formatting) is
    # unmaintained (RUSTSEC-2025-0119), no safe upgrade available upstream yet.
    # Not a vulnerability, just unmaintained — tracked in SECURITY.md, revisit when
    # indicatif drops it or a fork appears.
    "RUSTSEC-2025-0119",
    # paste (transitive via tokenizers -> fastembed, docbrain's local embedding
    # model) is unmaintained/archived (RUSTSEC-2024-0436), no safe upgrade
    # available upstream. Not a vulnerability, just unmaintained — revisit when
    # tokenizers moves off it or a fork appears.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Used by rustls' cert-bundling crates (webpki-root-certs/webpki-roots), pulled in
    # transitively via ureq (tree-sitter-language-pack's build-dependency, see below).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Internal workspace crates are referenced by path without a version (they're not
# published), which cargo-deny otherwise flags as "wildcard" dependencies. That's a
# real risk signal for an *external* unpinned dep, but not for our own path-based
# workspace members, so it's allowed here rather than pinning a version on every
# internal crate.
wildcards = "allow"

# Zero-network-egress invariant for the light tier (see SECURITY.md / plan §Security):
# agentops-scanner must never gain a RUNTIME HTTP/networking dependency. If this list
# needs to change, that's a signal to re-read the security section before merging, not
# just add the crate.
#
# Known, understood exception: `tree-sitter-language-pack` pulls in `ureq` as a
# *build-dependency* only (see SECURITY.md — it fetches/compiles grammar sources at
# `cargo build` time, not at runtime). This means building agentops-scanner from
# source requires network access, but the resulting binary makes zero network calls
# when actually scanning a repo. ureq is intentionally NOT in this deny list because
# banning it would break the build; the invariant this section enforces is scoped to
# crates that would introduce runtime egress.
#
# `fastembed` (docbrain's local embedding model) pulls in `hf-hub` and `ort`, both
# of which *could* drag in `reqwest`/`native-tls` via their default features — the
# root Cargo.toml deliberately selects their `-rustls-tls` feature variants instead
# (`hf-hub-rustls-tls`, `ort-download-binaries-rustls-tls`), which resolves without
# `reqwest` at all (verified via `cargo tree`). So no exception is needed here; this
# ban stays a hard, unconditional deny for the whole graph, including docbrain.
deny = [
    { name = "reqwest" },
    { name = "hyper-tls" },
    { name = "native-tls" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
