# Method 3 (classic terminal deployment): builds agentops/agentops-server/
# agentops-mcp-server for each platform and publishes them to a GitHub
# Release, plus a Next.js standalone frontend tarball (Method 3's
# "automate the frontend too" requirement -- see install.sh, which
# downloads and extracts both).
#
# Each target builds on a runner whose OS actually matches it, with one
# exception (`x86_64-apple-darwin` cross-compiles from `macos-14` -- see
# that matrix entry's own comment for why) -- deliberate given a real,
# empirically-confirmed constraint: `ort` (ONNX Runtime, via fastembed)
# downloads a prebuilt library at build time that needs GCC 13+'s
# libstdc++ ABI (verified while building the Method 1 Docker image --
# Debian bookworm's GCC 12 fails to link, trixie's GCC 14 works).
# ubuntu-24.04 ships GCC 13, which is why it's pinned below rather than
# ubuntu-latest/22.04.
#
# This hand-written workflow targets the same platform list as
# [workspace.metadata.dist] in the root Cargo.toml; running `cargo dist
# init` (once the `cargo-dist` tool is available) would regenerate an
# equivalent, cargo-dist-maintained version of this file with its own
# installer-generation logic -- not done here since that requires
# installing and running the tool interactively.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # GitHub has been retiring `macos-13` (the last Intel-hosted
          # runner image) -- a real release run against this exact matrix
          # entry sat "awaiting a runner" for the full 24h job timeout and
          # never started. `macos-14` is Apple Silicon only, so this target
          # now cross-compiles from there instead of building natively --
          # well-established or `rustup target add x86_64-apple-darwin`
          # plus `cargo build --target` alone is enough, Xcode's own
          # toolchain on the runner already supports linking for either
          # Apple Silicon Mach-O target from either host arch.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        # Explicit bash -- this is POSIX `if [ ... ]` syntax, but the
        # windows-latest runner's default shell is pwsh, which choked
        # parsing it ("Missing '(' after 'if'") the one time this ran for
        # real. bash is preinstalled (Git Bash) on GitHub's Windows runners
        # for exactly this reason.
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo build --release --target ${{ matrix.target }} --bin agentops --bin agentops-server --bin agentops-mcp-server
          else
            cargo build --release --bin agentops --bin agentops-server --bin agentops-mcp-server
          fi
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN_DIR=target/release
          if [ "${{ matrix.cross }}" = "true" ]; then BIN_DIR=target/${{ matrix.target }}/release; fi
          tar -czf dist/agentops-${{ matrix.target }}.tar.gz -C "$BIN_DIR" agentops agentops-server agentops-mcp-server
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Compress-Archive -Path target/release/agentops.exe,target/release/agentops-server.exe,target/release/agentops-mcp-server.exe -DestinationPath dist/agentops-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agentops-${{ matrix.target }}
          path: dist/*

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Package standalone build
        working-directory: apps/web
        run: |
          mkdir -p ../../dist/web
          cp -r .next/standalone/. ../../dist/web/
          cp -r .next/static ../../dist/web/.next/static
          cp -r public ../../dist/web/public
          tar -czf ../../dist/agentops-web-standalone.tar.gz -C ../../dist/web .
      - uses: actions/upload-artifact@v4
        with:
          name: agentops-web-standalone
          path: dist/agentops-web-standalone.tar.gz

  release:
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # npm/agentops-cli's postinstall shim downloads from this tag's GitHub
  # Release assets by exact version, so it must only publish once those
  # assets actually exist -- `needs: [release]`, not `needs: [build-binaries]`,
  # closes that race.
  publish-npm:
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Set package version from tag
        working-directory: npm/agentops-cli
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Publish
        working-directory: npm/agentops-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
