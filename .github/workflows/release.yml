# Method 3 (classic terminal deployment): builds agentops/agentops-server/
# agentops-mcp-server for each platform and publishes them to a GitHub
# Release, plus a Next.js standalone frontend tarball (Method 3's
# "automate the frontend too" requirement -- see install.sh, which
# downloads and extracts both).
#
# Each target builds on a runner whose OS actually matches it (no
# cross-compilation) -- deliberate given a real, empirically-confirmed
# constraint: `ort` (ONNX Runtime, via fastembed) downloads a prebuilt
# library at build time that needs GCC 13+'s libstdc++ ABI (verified while
# building the Method 1 Docker image -- Debian bookworm's GCC 12 fails to
# link, trixie's GCC 14 works). ubuntu-24.04 ships GCC 13, which is why
# it's pinned below rather than ubuntu-latest/22.04.
#
# No x86_64-apple-darwin (Intel Mac) target: `ort-sys` 2.0.0-rc.13 ships no
# prebuilt ONNX Runtime binary for that target at all, on any host --
# confirmed live against this exact workflow on both a macos-14 cross-
# compile attempt and a native macos-15-intel build, and matches multiple
# open upstream issues against pykeio/ort. Not a CI config problem, an
# upstream gap -- revisit if/when ort ships one again. Intel Mac users can
# still build from source (`cargo install --path agentops-core/crates/agentops-cli`).
#
# This hand-written workflow targets the same platform list as
# [workspace.metadata.dist] in the root Cargo.toml; running `cargo dist
# init` (once the `cargo-dist` tool is available) would regenerate an
# equivalent, cargo-dist-maintained version of this file with its own
# installer-generation logic -- not done here since that requires
# installing and running the tool interactively.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build
        # Explicit bash -- windows-latest's default shell is pwsh, which
        # choked ("Missing '(' after 'if'") on this step's POSIX syntax the
        # one time this used to be conditional here. Not conditional
        # anymore (see the matrix comment above for why cross-compiling
        # this away turned out not to work at all), but pinned anyway so a
        # future edit reintroducing shell syntax here doesn't silently
        # break on Windows again.
        shell: bash
        run: cargo build --release --bin agentops --bin agentops-server --bin agentops-mcp-server
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/agentops-${{ matrix.target }}.tar.gz -C target/release agentops agentops-server agentops-mcp-server
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Compress-Archive -Path target/release/agentops.exe,target/release/agentops-server.exe,target/release/agentops-mcp-server.exe -DestinationPath dist/agentops-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentops-${{ matrix.target }}
          path: dist/*

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Package standalone build
        working-directory: apps/web
        run: |
          mkdir -p ../../dist/web
          cp -r .next/standalone/. ../../dist/web/
          cp -r .next/static ../../dist/web/.next/static
          cp -r public ../../dist/web/public
          tar -czf ../../dist/agentops-web-standalone.tar.gz -C ../../dist/web .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentops-web-standalone
          path: dist/agentops-web-standalone.tar.gz

  release:
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true

  # npm/agentops-cli's postinstall shim downloads from this tag's GitHub
  # Release assets by exact version, so it must only publish once those
  # assets actually exist -- `needs: [release]`, not `needs: [build-binaries]`,
  # closes that race.
  publish-npm:
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Set package version from tag
        working-directory: npm/agentops-cli
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Publish
        working-directory: npm/agentops-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
