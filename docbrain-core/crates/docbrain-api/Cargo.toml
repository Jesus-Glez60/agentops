[package]
name = "docbrain-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "docbrain_api"

[[bin]]
name = "docbrain-api"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
docbrain-graph = { path = "../docbrain-graph" }
docbrain-mcp = { path = "../docbrain-mcp" }
tower-http = { version = "0.7.0", features = ["cors"] }
agentops-security = { path = "../../../agentops-core/crates/agentops-security" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
