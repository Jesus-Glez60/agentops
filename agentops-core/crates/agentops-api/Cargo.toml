[package]
name = "agentops-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agentops_api"

[[bin]]
name = "agentops-api"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
agentops-mcp = { path = "../agentops-mcp" }
agentops-security = { path = "../agentops-security" }
agentops-graph = { path = "../agentops-graph" }
agentops-manifest = { path = "../agentops-manifest" }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
