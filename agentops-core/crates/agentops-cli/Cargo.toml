[package]
name = "agentops-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentops"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
tokio.workspace = true

agentops-scanner = { path = "../agentops-scanner" }
agentops-graph = { path = "../agentops-graph" }
agentops-graph-pg = { path = "../agentops-graph-pg" }
agentops-notes = { path = "../agentops-notes" }
agentops-llm = { path = "../agentops-llm" }
agentops-linear = { path = "../agentops-linear" }
agentops-security = { path = "../agentops-security" }
agentops-mcp = { path = "../agentops-mcp" }
agentops-server = { path = "../agentops-server" }
agentops-embeddings = { path = "../agentops-embeddings" }
agentops-retrieval = { path = "../agentops-retrieval" }
agentops-manifest = { path = "../agentops-manifest" }
agentops-ruler-bridge = { path = "../agentops-ruler-bridge" }
# For `normalize_repo_path` -- shared with the server-side `register_repo`
# MCP tool so the two never drift apart (see agentops-repo-access::store).
agentops-repo-access = { path = "../agentops-repo-access" }
docbrain-mcp = { path = "../../../docbrain-core/crates/docbrain-mcp" }
docbrain-graph = { path = "../../../docbrain-core/crates/docbrain-graph" }
docbrain-ingest = { path = "../../../docbrain-core/crates/docbrain-ingest" }
dialoguer.workspace = true
# `.env` loading for `agentops init`/`agentops serve-api` -- no other crate
# in the workspace reads `.env` (everything else is bare `std::env::var`),
# so this stays scoped to the one binary that needs it rather than becoming
# a workspace-wide dependency.
dotenvy = "0.15"
# For `agentops connect --remote` -- same blocking client + version already
# used by agentops-github-app/agentops-llm/agentops-linear, not a new
# choice for this workspace.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { version = "3", features = ["json"] }
# For `agentops connect --remote`'s device-authorization login: attempts
# to auto-open the browser to the verification URL. Shells out to
# xdg-open/open/`cmd /c start` per-OS -- no HTTP/TLS deps of its own, so
# no interaction with this workspace's rustls-only policy.
open = "5"

# (`docgen` command goes through agentops-mcp::generate_docs, no direct
# agentops-docgen dep needed here.)

[dev-dependencies]
tempfile = "3"
