# Routes the browser-facing web UI publicly. The REST/MCP API (port 8420)
# is intentionally NOT routed here by default -- the frontend reaches it
# over localhost inside the same pod/container (see AGENTOPS_HEAVY_API_URL
# in the Dockerfile), so it doesn't need external routing unless you also
# want direct API-key-authed access from outside the cluster. Uncomment
# the second rule below for that.
#
# The web app now lives under /suite (its Next.js basePath -- see
# apps/web/next.config.ts) so the site root is reserved for a separate
# marketing app. Until that marketing app exists, `/` has no backend here
# and will 404 -- add its rule below (must come after /suite so nginx-ingress's
# longest-prefix match picks /suite first) once it ships.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: agentops.example.com
      http:
        paths:
          - path: /suite
            pathType: Prefix
            backend:
              service:
                name: agentops
                port:
                  name: web
          # - path: /api-external
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: agentops
          #       port:
          #         name: api
          # - path: /                       # future marketing app (e.g. Astro), added when it ships
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: marketing
          #       port:
          #         name: web
