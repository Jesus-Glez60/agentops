# SQLite lives under AGENTOPS_DATA_DIR (default ~/.agentops, i.e. /root/.agentops
# in this image) -- persists across pod restarts. ReadWriteOnce, for
# deployment.yaml's replicas: 1. Switching the code graph to Postgres
# (postgres-statefulset.yaml) does not change that: the other stores and
# the repo checkouts still live on this volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentops-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
