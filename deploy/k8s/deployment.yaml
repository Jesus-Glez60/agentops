# One image, both processes (pm2-runtime + ecosystem.config.js -- see the
# repo-root Dockerfile). replicas: 1 is load-bearing, Postgres or not:
# AGENTOPS_DATABASE_URL moves only the code graph to Postgres. Accounts,
# teams, integrations, repo connections, indexing jobs, docbrain and the
# repo checkouts stay on this pod's volume, and auth rate limits are kept
# in process memory, so a second replica would see different data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops
  template:
    metadata:
      labels:
        app: agentops
    spec:
      containers:
        - name: agentops
          image: agentops:latest
          ports:
            - name: web
              containerPort: 3000
            - name: api
              containerPort: 8420
          env:
            - name: AGENTOPS_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: AGENTOPS_SECRETS_MASTER_KEY
            - name: AGENTOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: AGENTOPS_DATABASE_URL
                  optional: true
            # Required: the server binds 0.0.0.0 in this image and refuses to
            # start without it.
            - name: AGENTOPS_API_KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: AGENTOPS_API_KEY_HASH
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /root/.agentops
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentops-data
