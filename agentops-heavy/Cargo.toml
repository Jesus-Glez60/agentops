[workspace]
resolver = "2"
members = [
    "crates/agentops-graph-pg",
    "crates/agentops-license",
    "crates/agentops-repo-access",
    "crates/agentops-github-app",
    "crates/agentops-heavy-api",
    "crates/agentops-embeddings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Deliberately NOT "MIT OR Apache-2.0" — see LICENSE-COMMERCIAL.md. Using an
# SPDX LicenseRef here rather than leaving it unset, so tooling that reads
# this field (including a future cargo-deny pass scoped to this workspace)
# gets an explicit, honest answer instead of "unspecified."
license = "LicenseRef-Commercial"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
base64 = "0.22"
rand = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "rand_core", "getrandom"] }
zeroize = "1"
hmac = "0.13"
sha2 = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tower-http = { version = "0.6", features = ["cors"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
wiremock = "0.6"
fastembed = "5"
qdrant-client = "1.18"

# Cross-workspace path dependencies into the open-core light tier.
agentops-security = { path = "../agentops-core/crates/agentops-security" }

# The light-tier GraphStore trait these crates implement against — a
# cross-workspace path dependency (Cargo supports this fine; it does NOT
# merge the two workspaces or their license postures).
agentops-graph = { path = "../agentops-core/crates/agentops-graph" }
