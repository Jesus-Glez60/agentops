[package]
name = "agentops-heavy-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agentops_heavy_api"

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tower-http.workspace = true
agentops-security.workspace = true
agentops-repo-access = { path = "../agentops-repo-access" }
agentops-github-app = { path = "../agentops-github-app" }
agentops-heavy-embeddings = { path = "../agentops-heavy-embeddings" }
agentops-heavy-consolidate = { path = "../agentops-heavy-consolidate" }
agentops-graph.workspace = true
docbrain-graph.workspace = true
agentops-mcp.workspace = true
agentops-linear.workspace = true
agentops-llm.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
agentops-accounts.workspace = true
agentops-teams.workspace = true
agentops-integrations.workspace = true
agentops-integration-modules.workspace = true
# agentops-license deliberately not a dependency this pass — 1.0 has no
# payment gate at all (see this crate's module doc comment).

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock.workspace = true
# Only to compute a valid TOTP code in tests, from the `secret` a
# `/auth/2fa/enroll` response returns -- production code never constructs
# a `TOTP` directly in this crate, that stays inside agentops-accounts.
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
