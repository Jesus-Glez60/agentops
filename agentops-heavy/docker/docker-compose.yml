name: agentops-heavy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentops_pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - agentops_qdrant_data:/qdrant/storage
    # The official qdrant image ships no wget/curl/nc (confirmed by inspecting
    # the container directly — a wget-based healthcheck silently never
    # passes, even though qdrant itself is fine). It does have bash, so a
    # dependency-free /dev/tcp connect check stands in for a real HTTP probe.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentops_pg_data:
  agentops_qdrant_data:
