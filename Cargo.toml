[workspace]
resolver = "2"
members = [
    "agentops-core/crates/agentops-scanner",
    "agentops-core/crates/agentops-graph",
    "agentops-core/crates/agentops-docgen",
    "agentops-core/crates/agentops-notes",
    "agentops-core/crates/agentops-security",
    "agentops-core/crates/agentops-manifest",
    "agentops-core/crates/agentops-ruler-bridge",
    "agentops-core/crates/agentops-agents-md",
    "agentops-core/crates/agentops-mcp",
    "agentops-core/crates/agentops-api",
    "agentops-core/crates/agentops-cli",
    "docbrain-core/crates/docbrain-ingest",
    "docbrain-core/crates/docbrain-graph",
    "docbrain-core/crates/docbrain-mcp",
    "docbrain-core/crates/docbrain-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jesusglez/agentops"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
petgraph = "0.6"
tree-sitter = "0.26"
tree-sitter-language-pack = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
axum = "0.8"
