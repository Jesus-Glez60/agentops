[workspace]
resolver = "2"
members = [
    "agentops-core/crates/agentops-scanner",
    "agentops-core/crates/agentops-graph",
    "agentops-core/crates/agentops-sqlite-support",
    "agentops-core/crates/agentops-embeddings",
    "agentops-core/crates/agentops-embeddings-train",
    "agentops-core/crates/agentops-docgen",
    "agentops-core/crates/agentops-retrieval",
    "agentops-core/crates/agentops-notes",
    "agentops-core/crates/agentops-llm",
    "agentops-core/crates/agentops-linear",
    "agentops-core/crates/agentops-security",
    "agentops-core/crates/agentops-manifest",
    "agentops-core/crates/agentops-ruler-bridge",
    "agentops-core/crates/agentops-agents-md",
    "agentops-core/crates/agentops-mcp",
    "agentops-core/crates/agentops-api",
    "agentops-core/crates/agentops-cli",
    "agentops-core/crates/agentops-graph-pg",
    "docbrain-core/crates/docbrain-ingest",
    "docbrain-core/crates/docbrain-graph",
    "docbrain-core/crates/docbrain-mcp",
    "docbrain-core/crates/docbrain-api",
    "agentops-core/crates/agentops-repo-access",
    "agentops-core/crates/agentops-github-app",
    "agentops-core/crates/agentops-heavy-api",
    "agentops-core/crates/agentops-heavy-embeddings",
    "agentops-core/crates/agentops-heavy-mcp",
    "agentops-core/crates/agentops-accounts",
    "agentops-core/crates/agentops-teams",
    "agentops-core/crates/agentops-integrations",
    "agentops-core/crates/agentops-integration-modules",
    "agentops-core/crates/agentops-heavy-consolidate",
    "agentops-core/crates/agentops-server",
    "agentops-core/crates/agentops-mcp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jesus-Glez60/agentops"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
petgraph = "0.6"
tree-sitter = "0.26"
# `download` is a *default* feature of this crate and, if left enabled, auto-downloads
# precompiled grammar binaries over the network at RUNTIME on first use — that would
# violate the zero-runtime-network-egress invariant for agentops-scanner (see
# SECURITY.md). Disabled here. `dynamic-loading` stays enabled: with TSLP_LANGUAGES set
# (see .cargo/config.toml), the build script fetches grammar *source* and compiles each
# requested language into a `.dylib`/`.so` under the build's OUT_DIR at BUILD time (a
# real, understood, build-time-only network dependency), then loads it via `libloading`
# at runtime from that same local path — no network call at runtime. Verified empirically
# against a throwaway probe crate, not assumed from docs (see commit history / session
# notes) — `default-features = false` alone breaks this, since it also drops
# `dynamic-loading`, which the *loading* step needs regardless of where the .dylib came
# from.
tree-sitter-language-pack = { version = "1", default-features = false, features = ["dynamic-loading"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
axum = "0.8"
regex = "1"
walkdir = "2"
toml = "0.8"
notify-debouncer-full = "0.7"
sha2 = "0.11"
getrandom = "0.4"
subtle = "2"
# Already a transitive dependency via hf-hub at this major version -- pinned
# here explicitly so `$HOME`-only env reads can move to `dirs::home_dir()`
# (Windows uses `%USERPROFILE%`) without introducing a second major version
# of the same crate into the dependency graph.
dirs = "6"

# --- agentops-graph-pg: optional Postgres GraphStore backend, part of core.
# A store adapter talking to a real Postgres server at runtime is expected
# here, unlike agentops-scanner's zero-egress rule.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
pgvector = { version = "0.4", features = ["postgres"] }

# --- docbrain: token-efficient neuron/synapse doc-graph rebuild ---
text-splitter = { version = "0.32", features = ["markdown", "tiktoken-rs"] }
tiktoken-rs = "0.12"
sqlite-vec = "0.1"
# `hf-hub`/`ort` (fastembed's model-download and runtime-download paths) default to
# `native-tls`-backed features, which would pull in crates banned workspace-wide
# (see deny.toml's zero-network-egress invariant). The `-rustls-tls` feature
# variants resolve without `reqwest`/`native-tls` at all (verified via `cargo
# tree`), so no ban exception is needed — deny.toml's ban stays unconditional.
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

# --- hosted repo access, accounts/teams, semantic search, local model
# consolidation: merged in from the former agentops-heavy workspace. ---
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
base64 = "0.22"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "rand_core", "getrandom"] }
zeroize = "1"
hmac = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
rsa = "0.9"
wiremock = "0.6"
# `download_snapshots` is a *default* feature that pulls in `reqwest`
# purely for downloading Qdrant snapshot files over HTTP — a feature this
# codebase never calls (no snapshot/restore workflow anywhere). Disabled to
# keep `reqwest` out of the graph entirely (see deny.toml's ban); `serde` is
# kept since `agentops-heavy-embeddings` relies on qdrant-client's typed
# `Payload`/`Value` (de)serialization.
qdrant-client = { version = "1.18", default-features = false, features = ["serde"] }
argon2 = "0.5"
aes-gcm = "0.10"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = "0.22"

# --- Method 3 (classic terminal deployment): cargo-dist config for
# .github/workflows/release.yml, which builds these bins per-platform and
# publishes shell/PowerShell installers to GitHub Releases. `agentops-server`
# and `agentops-mcp-server` are included alongside the `agentops` CLI (whose
# `serve-api` subcommand already subsumes agentops-server's job) since
# agentops-mcp-server is a separate integration point MCP clients connect to
# directly.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
installers = ["shell", "powershell"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ci = "github"
pr-run-mode = "plan"
