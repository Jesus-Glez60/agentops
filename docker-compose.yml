# Single-service by default (SQLite-only, no external DB needed) -- run
# `docker compose --profile postgres up` to also start a bundled Postgres
# for the code-graph store (agentops-graph-pg), and set AGENTOPS_DATABASE_URL
# accordingly in .env. Either way this is the one file a self-host user
# needs to download and run: `docker compose up`.
services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "8420:8420"
    env_file:
      - .env
    volumes:
      - agentops-data:/root/.agentops
      # Mount a `./secrets` dir here (gitignored) if using
      # AGENTOPS_GITHUB_APP_PRIVATE_KEY_PATH instead of pasting the raw PEM
      # into an env var -- e.g. AGENTOPS_GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-private-key.pem
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  # The marketing site (apps/marketing) -- separate static app serving the
  # site root `/`, while `app` above serves `/suite`. Not started by
  # `docker compose up` alone; add it to your reverse proxy (Caddyfile.example)
  # once you're routing the public site through this compose file.
  #
  # Build args matter here: apps/marketing/Dockerfile bakes
  # AGENTOPS_PUBLIC_API_URL into the static build (the contact form's
  # fetch() runs in the VISITOR's browser, so this must be a real publicly
  # reachable URL -- a Docker-internal hostname like `app:8420` will not
  # resolve there). The Dockerfile's own default points at the hosted
  # api.agentops.dedyn.io, which is correct for AgentOps's own public
  # deployment but WRONG for a self-host: silently reusing it would send a
  # self-hoster's contact-form leads to the vendor's API instead of their
  # own. There's no safe generic default here (it depends on your public
  # domain), so this deliberately has NO fallback -- `docker compose build`
  # fails loudly with an unset-variable error until you set
  # AGENTOPS_PUBLIC_API_URL in .env to wherever your own API is publicly
  # reachable (e.g. https://your-domain.example.com/api-external, per the
  # commented-out route in Caddyfile.example/deploy/k8s/ingress.yaml).
  marketing:
    build:
      context: ./apps/marketing
      args:
        AGENTOPS_PUBLIC_API_URL: ${AGENTOPS_PUBLIC_API_URL:?set this to your publicly-reachable API URL before building the marketing image -- see the comment above}
    ports:
      - "4321:4321"
    restart: unless-stopped

  postgres:
    # Pinned by digest, not the floating `pg16` tag -- Postgres pool/batching
    # plan, Phase 3: the HNSW vector index migration needs pgvector >=0.5.0,
    # confirmed as 0.8.6 on this exact image (`SELECT extversion FROM
    # pg_extension WHERE extname='vector'` against a real deployment's live
    # container). A floating tag could silently move to a version this
    # migration wasn't verified against.
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    volumes:
      - agentops-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # `docker compose --profile caddy up` -- TLS-terminating reverse proxy for
  # a public deployment. Copy Caddyfile.example to Caddyfile (gitignored,
  # holds your real domain) before enabling this profile.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  agentops-data:
  agentops-postgres:
  caddy-data:
  caddy-config:
